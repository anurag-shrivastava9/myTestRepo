<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test@Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
            text-align: center;
        }
        .header-links {
            text-align: right;
            padding: 10px 20px;
        }
        .header-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #5f6368;
            font-size: 14px;
        }
        .logo {
            margin-top: 100px;
        }
        .logo h1 {
            font-size: 80px;
            font-weight: normal;
            margin-bottom: 30px;
        }
        .search-box {
            width: 60%;
            max-width: 600px;
            padding: 12px 28px;
            border: 1px solid #dadce0;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            box-shadow: none;
        }
        .buttons {
            margin-top: 30px;
        }
        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: 1px;
            background-color: #cad2da;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #f2f2f2;
            padding: 10px 0;
            font-size: 14px;
            color: #5f6368;
        }
        footer .footer-links {
            display: flex;
            justify-content: space-between;
            max-width: 900px;
            margin: auto;
        }
        footer .footer-links a {
            margin: 0 15px;
            color: #5f6368;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Header Links -->
    <div class="header-links">
        <a href="#">My Account</a>
        <a href="#">My Orders</a>
    </div>

    <!-- Logo -->
    <div class="logo">
        <h1>
            <span style="color: #4285F4;">T</span>
            <span style="color: #EA4335;">e</span>
            <span style="color: #FBBC05;">s</span>
            <span style="color: #4285F4;">t</span>
            <span style="color: #34A853;">@</span>
            <span style="color: #EA4335;">P</span>
            <span style="color: #4285F4;">a</span>
            <span style="color: #EA4335;">g</span>
            <span style="color: #4285F4;">e</span>
        </h1>
    </div>

    <!-- Search Box -->
    <input type="text" class="search-box" placeholder="Search for anything" />

    <!-- Buttons -->
    <div class="buttons">
        <button>Search</button>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <div>
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search Works</a>
            </div>
            <div>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>
<div id="pref-center-main" style="max-width: 980px; margin: 32px auto 120px; padding: 0 16px;">
    <div id="pref-center-container" style="text-align: center; color: #5f6368; padding: 40px 0;">
        Loading Preference Center...
    </div>
</div>

<script>
/**
 * Load the Salesforce Preference Center from the proxy server.
 * 
 * The proxy avoids CORS and CSP frame-ancestors restrictions.
 * Update PROXY_URL to match your deployed proxy server.
 */

// CONFIGURATION: Update this to your deployed proxy server URL
const PROXY_URL = 'http://localhost:3000'; // For local testing
// const PROXY_URL = 'https://my-proxy.vercel.app'; // For production (Vercel example)
// const PROXY_URL = 'https://my-proxy.herokuapp.com'; // For production (Heroku example)

const PREF_CENTER_NAME = 'Cunard_Newsletter_Apex';
const CONTAINER_ID = 'pref-center-container';

async function loadPreferenceCenter() {
  const container = document.getElementById(CONTAINER_ID);
  
  try {
    const url = `${PROXY_URL}/api/preference-center?prefCenter=${encodeURIComponent(PREF_CENTER_NAME)}`;
    console.log(`[PC Loader] Fetching from proxy: ${url}`);
    
    const response = await fetch(url, {
      method: 'GET',
      headers: {
        'Accept': 'text/html'
      }
    });

    if (!response.ok) {
      throw new Error(`Proxy returned ${response.status}: ${response.statusText}`);
    }

    const html = await response.text();
    container.innerHTML = html;
    console.log('[PC Loader] Preference Center loaded successfully');
  } catch (err) {
    console.error('[PC Loader] Error:', err.message);
    container.innerHTML = `
      <div style="background: #fce5e5; border: 1px solid #f44336; border-radius: 4px; padding: 16px; color: #c62828;">
        <strong>Unable to load Preference Center</strong>
        <p style="margin: 8px 0 0 0; font-size: 13px;">
          ${err.message}
        </p>
        <p style="margin: 8px 0 0 0; font-size: 13px;">
          <strong>Make sure:</strong>
          <br>1. Proxy server is running (or deployed)
          <br>2. PROXY_URL is set correctly in this script
          <br>3. The proxy server has internet access to Salesforce
          <br><br>
          <a href="https://carnivaluk--crmsdev.sandbox.my.salesforce.com/services/PreferenceCenter?prefCenter=Cunard_Newsletter_Apex" target="_blank" rel="noopener noreferrer" style="color: #1976d2;">Open Preference Center directly</a>
        </p>
      </div>
    `;
  }
}

// Load preference center when the page is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', loadPreferenceCenter);
} else {
  loadPreferenceCenter();
}
</script>
</body>
</html>
